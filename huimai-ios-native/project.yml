# XcodeGen 工程描述：在云端（或本地 Mac）执行 `xcodegen generate` 即生成 Huimai.xcodeproj
# 这样 Windows 上也能维护原生工程，无需手改 project.pbxproj
name: Huimai
options:
  bundleIdPrefix: com.huimai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Huimai:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huimai.native
        PRODUCT_NAME: Huimai
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"

schemes:
  Huimai:
    build:
      targets:
        Huimai: all
    run:
      config: Debug
    archive:
      config: Release
